[General]
# Device name visible to other Bluetooth devices
Name = RaspberryPi-Audio

# Device class: Audio/Video (Service Class: Audio, Major Class: Audio/Video)
Class = 0x20041C

# Always discoverable
DiscoverableTimeout = 0

# Always pairable
PairableTimeout = 0

# Enable privacy (use random addresses)
Privacy = device

# Automatically enable controllers
AutoEnable = true

# Enable experimental features (required for some newer Bluetooth features)
Experimental = true

# Enable AVRCP (Audio/Video Remote Control Profile) for volume control
[Policy]
AutoEnable = true
ReconnectAttempts = 7
ReconnectIntervals = 1,2,4,8,16,32,64

[LE]
# Low Energy settings
MinConnectionInterval = 7
MaxConnectionInterval = 9
ConnectionLatency = 0
ConnectionSupervisionTimeout = 100
