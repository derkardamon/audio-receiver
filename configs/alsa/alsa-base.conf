# Set HiFiBerry DAC+ ADC Pro as the default sound card (Card 0)
# This ensures Bluetooth audio routes to the HiFiBerry instead of HDMI

# Disable HDMI audio (vc4-hdmi) from loading first
options snd-bcm2835 index=-2

# Make HiFiBerry (snd_rpi_hifiberry_dacplusadcpro) the default card
options snd_rpi_hifiberry_dacplusadcpro index=0

# Alternative: Use card name matching
# options snd slots=snd_rpi_hifiberry_dacplusadcpro
